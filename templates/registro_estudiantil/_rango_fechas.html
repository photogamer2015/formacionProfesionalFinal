{% comment %}Selector de rango de fechas: copia exacta del de «Lista de Matriculados» (templates/matricula/lista.html). Va dentro de un <form method="get">: al aceptar envía fecha_desde y fecha_hasta.{% endcomment %}
        <div class="matricula-date-range" data-date-range-picker>
            <input type="hidden" name="fecha_desde" value="{{ fecha_desde }}">
            <input type="hidden" name="fecha_hasta" value="{{ fecha_hasta }}">
            <button type="button" class="date-range-trigger" data-date-range-trigger aria-haspopup="dialog" aria-expanded="false">
                <span aria-hidden="true">📅</span>
                <span class="date-range-trigger-text" data-date-range-label>Fecha matric.</span>
                <span class="date-range-trigger-caret" aria-hidden="true">▾</span>
            </button>
            <div class="date-range-popover" data-date-range-popover hidden>
                <div class="date-range-layout">
                    <div class="date-range-presets">
                        <div class="date-range-presets-title">Fecha matric.</div>
                        <button type="button" class="date-range-preset" data-preset="all">Sin filtro</button>
                        <button type="button" class="date-range-preset" data-preset="today">Hoy</button>
                        <button type="button" class="date-range-preset" data-preset="yesterday">Ayer</button>
                        <button type="button" class="date-range-preset" data-preset="last7">Últimos 7 días</button>
                        <button type="button" class="date-range-preset" data-preset="last14">Últimos 14 días</button>
                        <button type="button" class="date-range-preset" data-preset="last30">Últimos 30 días</button>
                        <button type="button" class="date-range-preset" data-preset="thisWeek">Esta semana</button>
                        <button type="button" class="date-range-preset" data-preset="thisMonth">Este mes</button>
                        <button type="button" class="date-range-preset" data-preset="lastMonth">El mes pasado</button>
                    </div>
                    <div class="date-range-main">
                        <div class="date-range-calendars">
                            <div class="date-range-calendar" data-calendar-offset="0"></div>
                            <div class="date-range-calendar" data-calendar-offset="1"></div>
                        </div>
                    </div>
                </div>
                <div class="date-range-footer">
                    <label class="date-range-mode-toggle">
                        <input type="checkbox" data-range-mode>
                        <span>Ver por rango</span>
                    </label>
                    <div class="date-range-actions">
                        <button type="button" class="btn btn-secondary btn-sm" data-date-range-clear>Limpiar</button>
                        <button type="button" class="btn btn-secondary btn-sm" data-date-range-cancel>Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm" data-date-range-apply>Aceptar</button>
                    </div>
                </div>
                <div class="date-range-floating" data-range-floating hidden>
                    <div class="date-range-floating-calendars">
                        <div class="date-range-calendar" data-range-calendar-offset="0"></div>
                        <div class="date-range-calendar" data-range-calendar-offset="1"></div>
                    </div>
                    <div class="date-range-floating-actions">
                        <button type="button" class="btn btn-secondary btn-sm" data-range-clear>Limpiar</button>
                        <button type="button" class="btn btn-secondary btn-sm" data-range-cancel>Cancelar</button>
                        <button type="button" class="btn btn-primary btn-sm" data-range-accept>Aceptar</button>
                    </div>
                </div>
            </div>
        </div>

<script>
    (function () {
        const pickers = document.querySelectorAll('[data-date-range-picker]');
        if (!pickers.length) return;

        const monthNames = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'sep', 'oct', 'nov', 'dic'];
        const fullMonthNames = ['enero', 'febrero', 'marzo', 'abril', 'mayo', 'junio', 'julio', 'agosto', 'septiembre', 'octubre', 'noviembre', 'diciembre'];
        const weekDays = ['Lun', 'Mar', 'Mié', 'Jue', 'Vie', 'Sáb', 'Dom'];

        function pad(value) {
            return String(value).padStart(2, '0');
        }

        function toISO(date) {
            if (!date) return '';
            return date.getFullYear() + '-' + pad(date.getMonth() + 1) + '-' + pad(date.getDate());
        }

        function parseISO(value) {
            if (!/^\d{4}-\d{2}-\d{2}$/.test(value || '')) return null;
            const parts = value.split('-').map(Number);
            const date = new Date(parts[0], parts[1] - 1, parts[2]);
            if (
                date.getFullYear() !== parts[0] ||
                date.getMonth() !== parts[1] - 1 ||
                date.getDate() !== parts[2]
            ) {
                return null;
            }
            return date;
        }

        function today() {
            const date = new Date();
            return new Date(date.getFullYear(), date.getMonth(), date.getDate());
        }

        function cloneDate(date) {
            return date ? new Date(date.getFullYear(), date.getMonth(), date.getDate()) : null;
        }

        function addDays(date, days) {
            const next = cloneDate(date);
            next.setDate(next.getDate() + days);
            return next;
        }

        function compareDates(a, b) {
            return toISO(a).localeCompare(toISO(b));
        }

        function sameDate(a, b) {
            return Boolean(a && b && toISO(a) === toISO(b));
        }

        function startOfWeek(date) {
            const result = cloneDate(date);
            const day = (result.getDay() + 6) % 7;
            result.setDate(result.getDate() - day);
            return result;
        }

        function endOfWeek(date) {
            return addDays(startOfWeek(date), 6);
        }

        function formatDate(date) {
            return date.getDate() + ' ' + monthNames[date.getMonth()] + ' ' + date.getFullYear();
        }

        function presetRange(key) {
            const current = today();
            if (key === 'all') return { start: null, end: null };
            if (key === 'today') return { start: current, end: current };
            if (key === 'yesterday') {
                const yesterday = addDays(current, -1);
                return { start: yesterday, end: yesterday };
            }
            if (key === 'last7') return { start: addDays(current, -6), end: current };
            if (key === 'last14') return { start: addDays(current, -13), end: current };
            if (key === 'last30') return { start: addDays(current, -29), end: current };
            if (key === 'thisWeek') return { start: startOfWeek(current), end: endOfWeek(current) };
            if (key === 'thisMonth') {
                return {
                    start: new Date(current.getFullYear(), current.getMonth(), 1),
                    end: new Date(current.getFullYear(), current.getMonth() + 1, 0),
                };
            }
            if (key === 'lastMonth') {
                return {
                    start: new Date(current.getFullYear(), current.getMonth() - 1, 1),
                    end: new Date(current.getFullYear(), current.getMonth(), 0),
                };
            }
            return { start: null, end: null };
        }

        pickers.forEach(function (picker) {
            const form = picker.closest('form');
            const trigger = picker.querySelector('[data-date-range-trigger]');
            const popover = picker.querySelector('[data-date-range-popover]');
            const label = picker.querySelector('[data-date-range-label]');
            const startHidden = picker.querySelector('input[name="fecha_desde"]');
            const endHidden = picker.querySelector('input[name="fecha_hasta"]');
            const applyButton = picker.querySelector('[data-date-range-apply]');
            const cancelButton = picker.querySelector('[data-date-range-cancel]');
            const clearButton = picker.querySelector('[data-date-range-clear]');
            const rangeMode = picker.querySelector('[data-range-mode]');
            const rangeFloating = picker.querySelector('[data-range-floating]');
            const rangeClearButton = picker.querySelector('[data-range-clear]');
            const rangeCancelButton = picker.querySelector('[data-range-cancel]');
            const rangeAcceptButton = picker.querySelector('[data-range-accept]');
            const presetButtons = picker.querySelectorAll('[data-preset]');
            const calendars = picker.querySelectorAll('[data-calendar-offset]');
            const rangeCalendars = picker.querySelectorAll('[data-range-calendar-offset]');
            let draftStart = null;
            let draftEnd = null;
            let rangeStart = null;
            let rangeEnd = null;
            let viewYear = today().getFullYear();
            let viewMonth = today().getMonth();
            let rangeViewYear = today().getFullYear();
            let rangeViewMonth = today().getMonth();

            function orderDates(start, end) {
                if (start && end && compareDates(start, end) > 0) {
                    return [end, start];
                }
                return [start, end];
            }

            function normalizeDraft() {
                const ordered = orderDates(draftStart, draftEnd);
                draftStart = ordered[0];
                draftEnd = ordered[1];
            }

            function normalizeRangeDraft() {
                const ordered = orderDates(rangeStart, rangeEnd);
                rangeStart = ordered[0];
                rangeEnd = ordered[1];
            }

            function setViewFromDraft() {
                const reference = draftStart || draftEnd || today();
                viewYear = reference.getFullYear();
                viewMonth = reference.getMonth();
            }

            function setRangeViewFromDraft() {
                const reference = rangeStart || rangeEnd || draftStart || draftEnd || today();
                rangeViewYear = reference.getFullYear();
                rangeViewMonth = reference.getMonth();
            }

            function updateLabel() {
                const appliedStart = parseISO(startHidden.value);
                const appliedEnd = parseISO(endHidden.value);
                let text = 'Fecha matric.';
                if (appliedStart && appliedEnd) {
                    text = sameDate(appliedStart, appliedEnd)
                        ? 'Fecha matric.: ' + formatDate(appliedStart)
                        : 'Fecha matric.: ' + formatDate(appliedStart) + ' - ' + formatDate(appliedEnd);
                } else if (appliedStart) {
                    text = 'Desde ' + formatDate(appliedStart);
                } else if (appliedEnd) {
                    text = 'Hasta ' + formatDate(appliedEnd);
                }
                label.textContent = text;
                picker.classList.toggle('has-value', Boolean(appliedStart || appliedEnd));
            }

            function renderPresetState() {
                presetButtons.forEach(function (button) {
                    const range = presetRange(button.dataset.preset);
                    const active = (
                        (!draftStart && !draftEnd && !range.start && !range.end) ||
                        (sameDate(draftStart, range.start) && sameDate(draftEnd, range.end))
                    );
                    button.classList.toggle('is-active', active);
                });
            }

            function renderMonth(container, offset, start, end, baseYear, baseMonth, dayAttr, navAttr) {
                const monthDate = new Date(viewYear, viewMonth + offset, 1);
                if (baseYear !== undefined && baseMonth !== undefined) {
                    monthDate.setFullYear(baseYear);
                    monthDate.setMonth(baseMonth + offset, 1);
                }
                const year = monthDate.getFullYear();
                const month = monthDate.getMonth();
                const firstDay = new Date(year, month, 1);
                const lastDay = new Date(year, month + 1, 0).getDate();
                const leading = (firstDay.getDay() + 6) % 7;
                const todayISO = toISO(today());
                let html = '<div class="date-range-calendar-head">';
                html += offset === 0
                    ? '<button type="button" class="date-range-nav" ' + navAttr + '="-1" aria-label="Mes anterior">‹</button>'
                    : '<span></span>';
                html += '<div class="date-range-calendar-title">' + fullMonthNames[month] + ' ' + year + '</div>';
                html += offset === 1
                    ? '<button type="button" class="date-range-nav" ' + navAttr + '="1" aria-label="Mes siguiente">›</button>'
                    : '<span></span>';
                html += '</div>';
                html += '<div class="date-range-weekdays">' + weekDays.map(function (day) {
                    return '<span>' + day + '</span>';
                }).join('') + '</div>';
                html += '<div class="date-range-days">';
                for (let i = 0; i < leading; i += 1) {
                    html += '<span class="date-range-empty-day"></span>';
                }
                for (let day = 1; day <= lastDay; day += 1) {
                    const date = new Date(year, month, day);
                    const iso = toISO(date);
                    const selectedStart = start && iso === toISO(start);
                    const selectedEnd = end && iso === toISO(end);
                    const inRange = start && end && compareDates(date, start) >= 0 && compareDates(date, end) <= 0;
                    const classes = [
                        'date-range-day',
                        iso === todayISO ? 'is-today' : '',
                        inRange ? 'is-in-range' : '',
                        selectedStart ? 'is-selected-start' : '',
                        selectedEnd ? 'is-selected-end' : '',
                    ].filter(Boolean).join(' ');
                    html += '<button type="button" class="' + classes + '" ' + dayAttr + '="' + iso + '">' + day + '</button>';
                }
                html += '</div>';
                container.innerHTML = html;
            }

            function render() {
                normalizeDraft();
                calendars.forEach(function (calendar) {
                    renderMonth(
                        calendar,
                        Number(calendar.dataset.calendarOffset || 0),
                        draftStart,
                        draftEnd,
                        viewYear,
                        viewMonth,
                        'data-date-day',
                        'data-month-nav'
                    );
                });
                renderPresetState();
            }

            function renderRange() {
                normalizeRangeDraft();
                rangeCalendars.forEach(function (calendar) {
                    renderMonth(
                        calendar,
                        Number(calendar.dataset.rangeCalendarOffset || 0),
                        rangeStart,
                        rangeEnd,
                        rangeViewYear,
                        rangeViewMonth,
                        'data-range-day',
                        'data-range-month-nav'
                    );
                });
            }

            function positionPopover() {
                popover.style.left = '0px';
                const rect = popover.getBoundingClientRect();
                const maxRight = window.innerWidth - 16;
                if (rect.right > maxRight) {
                    popover.style.left = '-' + (rect.right - maxRight) + 'px';
                }
                const adjusted = popover.getBoundingClientRect();
                if (adjusted.left < 12) {
                    const currentLeft = Number.parseFloat(popover.style.left || '0') || 0;
                    popover.style.left = (currentLeft + 12 - adjusted.left) + 'px';
                }
            }

            function closeRangeWindow() {
                rangeFloating.hidden = true;
                rangeMode.checked = false;
            }

            function openRangeWindow() {
                rangeStart = cloneDate(draftStart);
                rangeEnd = cloneDate(draftEnd);
                setRangeViewFromDraft();
                rangeMode.checked = true;
                rangeFloating.hidden = false;
                renderRange();
            }

            function openPicker() {
                draftStart = parseISO(startHidden.value);
                draftEnd = parseISO(endHidden.value);
                setViewFromDraft();
                closeRangeWindow();
                popover.hidden = false;
                trigger.setAttribute('aria-expanded', 'true');
                render();
                positionPopover();
            }

            function closePicker() {
                popover.hidden = true;
                trigger.setAttribute('aria-expanded', 'false');
                closeRangeWindow();
            }

            function submitDraft() {
                if (draftStart && !draftEnd) draftEnd = cloneDate(draftStart);
                if (!draftStart && draftEnd) draftStart = cloneDate(draftEnd);
                normalizeDraft();
                startHidden.value = toISO(draftStart);
                endHidden.value = toISO(draftEnd);
                updateLabel();
                closePicker();
                if (form && typeof form.requestSubmit === 'function') {
                    form.requestSubmit();
                } else if (form) {
                    form.submit();
                }
            }

            trigger.addEventListener('click', function () {
                if (popover.hidden) {
                    openPicker();
                } else {
                    closePicker();
                }
            });

            popover.addEventListener('click', function (event) {
                event.stopPropagation();
                const dayButton = event.target.closest('[data-date-day]');
                const navButton = event.target.closest('[data-month-nav]');
                const presetButton = event.target.closest('[data-preset]');

                if (dayButton) {
                    const selected = parseISO(dayButton.dataset.dateDay);
                    draftStart = selected;
                    draftEnd = selected;
                    render();
                    return;
                }

                if (navButton) {
                    const next = new Date(viewYear, viewMonth + Number(navButton.dataset.monthNav || 0), 1);
                    viewYear = next.getFullYear();
                    viewMonth = next.getMonth();
                    render();
                    return;
                }

                if (presetButton) {
                    const range = presetRange(presetButton.dataset.preset);
                    draftStart = range.start;
                    draftEnd = range.end;
                    setViewFromDraft();
                    render();
                }
            });

            rangeFloating.addEventListener('click', function (event) {
                event.stopPropagation();
                const dayButton = event.target.closest('[data-range-day]');
                const navButton = event.target.closest('[data-range-month-nav]');

                if (dayButton) {
                    const selected = parseISO(dayButton.dataset.rangeDay);
                    if (!rangeStart || (rangeStart && rangeEnd)) {
                        rangeStart = selected;
                        rangeEnd = null;
                    } else if (compareDates(selected, rangeStart) < 0) {
                        rangeEnd = rangeStart;
                        rangeStart = selected;
                    } else {
                        rangeEnd = selected;
                    }
                    renderRange();
                    return;
                }

                if (navButton) {
                    const next = new Date(
                        rangeViewYear,
                        rangeViewMonth + Number(navButton.dataset.rangeMonthNav || 0),
                        1
                    );
                    rangeViewYear = next.getFullYear();
                    rangeViewMonth = next.getMonth();
                    renderRange();
                }
            });

            cancelButton.addEventListener('click', closePicker);

            clearButton.addEventListener('click', function () {
                draftStart = null;
                draftEnd = null;
                setViewFromDraft();
                render();
            });

            applyButton.addEventListener('click', submitDraft);

            rangeMode.addEventListener('change', function () {
                if (rangeMode.checked) {
                    openRangeWindow();
                } else {
                    closeRangeWindow();
                }
            });

            rangeClearButton.addEventListener('click', function () {
                rangeStart = null;
                rangeEnd = null;
                renderRange();
            });

            rangeCancelButton.addEventListener('click', closeRangeWindow);

            rangeAcceptButton.addEventListener('click', function () {
                if (rangeStart && !rangeEnd) rangeEnd = cloneDate(rangeStart);
                if (!rangeStart && rangeEnd) rangeStart = cloneDate(rangeEnd);
                normalizeRangeDraft();
                draftStart = cloneDate(rangeStart);
                draftEnd = cloneDate(rangeEnd);
                submitDraft();
            });

            document.addEventListener('click', function (event) {
                if (!popover.hidden && !picker.contains(event.target)) {
                    closePicker();
                }
            });

            document.addEventListener('keydown', function (event) {
                if (event.key === 'Escape' && !rangeFloating.hidden) {
                    closeRangeWindow();
                } else if (event.key === 'Escape' && !popover.hidden) {
                    closePicker();
                }
            });

            window.addEventListener('resize', function () {
                if (!popover.hidden) positionPopover();
            });

            updateLabel();
        });
    })();
</script>
